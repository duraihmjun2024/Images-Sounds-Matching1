<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PUPS - Sound Match Game</title>
  <style>
    :root {
      --primary: #1a73e8;
      --accent: #34a853;
      --bg: #121212;
      --text: #e8eaed;
      --border: #3c4043;
      --card-bg: #1e1e1e;
      --correct-border: #2e7d32;
      --correct-bg: #1b5e20;
      --wrong-border: #c62828;
      --wrong-bg: #b71c1c;
      --missed-border: #0288d1;
      --missed-bg: #01579b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
    body { display: flex; flex-direction: column; }

    header { background: #1f1f1f; color: #fff; padding: 4px 8px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; border-bottom: 1px solid var(--border); }
    header h1 { font-size: 0.85rem; font-weight: 600; color: #8ab4f8; }

    main { flex: 1; padding: 2px; display: flex; flex-direction: column; overflow: hidden; }

    .controls-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      margin-bottom: 2px;
      padding: 4px 6px;
      background: #1e1e1e;
      border: 1px solid var(--border);
      border-radius: 4px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    
    .btn-group { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
    .action-btn { padding: 6px 10px; background: var(--primary); color: white; border: none; border-radius: 4px; font-weight: 600; font-size: 0.75rem; cursor: pointer; }
    .action-btn.start { background: var(--accent); }
    .action-btn.reset { background: #5f6368; }
    .action-btn.tts { background: #9c27b0; }
    .action-btn.stt { background: #e65100; }
    .action-btn:disabled { background: #3c4043 !important; color: #80868b !important; cursor: not-allowed; }

    .stt-container { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
    .stt-box { font-size: 0.65rem; color: #8ab4f8; background: #172b4d; padding: 2px 6px; border-radius: 3px; border: 1px solid #253858; max-width: 180px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stt-box span { font-weight: bold; color: #ffb74d; }

    .audio-status-inline { font-size: 0.65rem; font-weight: 600; color: #81c784; background: #1b5e20; padding: 2px 6px; border-radius: 3px; border: 1px solid #2e7d32; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .score-board { display: flex; gap: 4px; font-size: 0.7rem; font-weight: 600; }
    .score-item { background: #282a2c; padding: 2px 6px; border-radius: 3px; border: 1px solid var(--border); color: #e8eaed; }

    .game-container { flex: 1; width: 100%; overflow: hidden; display: flex; flex-direction: column; }

    .mode-portrait { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; height: 100%; overflow: hidden; }
    .portrait-col { display: flex; flex-direction: column; gap: 2px; height: 100%; justify-content: space-between; width: 100%; }
    .portrait-col-title { font-size: 0.65rem; font-weight: bold; color: #9aa0a6; text-align: center; padding: 2px 0; background: #282a2c; border-radius: 2px; flex-shrink: 0; }
    .portrait-img-card { display: flex; flex-direction: row; align-items: center; background: #ffffff; border: 1px solid var(--border); border-radius: 3px; overflow: hidden; flex: 1; width: 100%; }
    .portrait-img-card img { width: 65%; height: 100%; object-fit: contain; background: #ffffff; display: block; }
    .portrait-drop-box { width: 35%; height: 100%; background: #2d2e30; border-left: 1px dashed var(--border); display: flex; align-items: center; justify-content: center; }
    .portrait-sound-slot { flex: 1; border: 1px dashed var(--border); background: #1e1e1e; border-radius: 3px; display: flex; align-items: center; justify-content: center; width: 100%; }

    .mode-landscape { display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 3px; width: 100%; height: 100%; overflow: hidden; }
    .landscape-grid-header { grid-column: span 13; font-weight: bold; font-size: 0.7rem; color: #9aa0a6; padding: 2px 0; }
    .landscape-img-card { background: #ffffff; border: 1px solid var(--border); border-radius: 3px; display: flex; flex-direction: column; align-items: center; overflow: hidden; height: 100%; }
    .landscape-img-card img { width: 100%; height: 55%; object-fit: contain; background: #ffffff; display: block; }
    .landscape-drop-box { width: 100%; height: 45%; background: #2d2e30; border-top: 1px dashed var(--border); display: flex; align-items: center; justify-content: center; }
    .landscape-sound-slot { border: 1px dashed var(--border); background: #1e1e1e; border-radius: 3px; display: flex; align-items: center; justify-content: center; height: 100%; }

    .sound-drop-box.correct { border: 2px solid var(--correct-border) !important; background-color: var(--correct-bg) !important; }
    .sound-drop-box.wrong { border: 2px solid var(--wrong-border) !important; background-color: var(--wrong-bg) !important; }
    .sound-drop-box.missed { border: 2px solid var(--missed-border) !important; background-color: var(--missed-bg) !important; }

    .draggable-sound {
      width: 100%;
      height: 100%;
      background: #172b4d;
      border: 1px solid #253858;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      touch-action: none;
      box-sizing: border-box;
    }
    .draggable-sound.dragging { opacity: 0.4; }

    .audio-symbol-btn {
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      line-height: 1;
      color: #8ab4f8;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-card {
      background: #1e1e1e;
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 8px;
      text-align: center;
      width: 85%;
      max-width: 320px;
    }

    .modal-card h2 { font-size: 0.95rem; margin-bottom: 6px; color: #8ab4f8; }
    .modal-card p { font-size: 0.78rem; margin-bottom: 12px; color: #9aa0a6; }

    .modal-btns { display: flex; gap: 8px; justify-content: center; }
    .modal-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.8rem;
      cursor: pointer;
      background: var(--primary);
      color: white;
    }
    .modal-btn.secondary { background: #3c4043; }
  </style>
</head>
<body>

  <div id="orientationModal" class="modal-overlay">
    <div class="modal-card">
      <h2>📱 Tap Screen to Unlock Board</h2>
      <p>Touch any button to activate smartboard audio:</p>
      <div class="modal-btns">
        <button class="modal-btn" id="btnPortrait">📱 Portrait Mode</button>
        <button class="modal-btn secondary" id="btnLandscape">🔄 Landscape Mode</button>
      </div>
    </div>
  </div>

  <header>
    <h1>PUPS - Sound Match Game</h1>
    <span id="headerStatus" style="font-size:0.68rem;">Ready</span>
  </header>

  <main>
    <div class="controls-top">
      <div class="btn-group">
        <button id="btnStart" class="action-btn start">▶ Start</button>
        <button id="btnCheck" class="action-btn" disabled>Check</button>
        <button id="btnReset" class="action-btn reset" disabled>Reset</button>

        <button id="btnTtsTa" class="action-btn tts">🔊 TTS (TA)</button>
        <button id="btnTtsEn" class="action-btn tts">🔊 TTS (EN)</button>
        <button id="btnSttTa" class="action-btn stt">🎙 STT (TA)</button>
        <button id="btnSttEn" class="action-btn stt">🎙️ STT (EN)</button>
      </div>

      <div class="stt-container">
        <div class="stt-box"><b>TA:</b> <span id="sttResultTa">Waiting...</span></div>
        <div class="stt-box"><b>EN:</b> <span id="sttResultEn">Waiting...</span></div>
      </div>

      <div id="audioStatus" class="audio-status-inline">🎵 Sound Engine Initializing...</div>

      <div class="score-board">
        <div class="score-item">⏱ <span id="timer">00:00</span></div>
        <div class="score-item">⭐ <span id="score">0/13</span></div>
      </div>
    </div>

    <div id="gameContainer" class="game-container"></div>
  </main>

  <script>
    const TAMIL_SENTENCE = "விடாமுயற்சியும் விவேக பயிற்சியும் வெற்றி தரும்";
    const ENGLISH_SENTENCE = "Perseverance and prudent practice lead to success";

    const dataset = [
      { id: "1",  img: "https://lh3.googleusercontent.com/d/1UOHjdl49bQgPwiebvMhstgvtW03rFau4", audioId: "1oucN6FzxzB4OGZnkeHi6_3noO5yUcvPw" },
      { id: "2",  img: "https://lh3.googleusercontent.com/d/1CYREKVkeAXXfWN2BSA9jCmbxMqBLnTya", audioId: "1JWjGWxzyMtI5zPwtabLmy9mNRz-jBZby" },
      { id: "3",  img: "https://lh3.googleusercontent.com/d/1R9dJLOKAEMhHt_ikfQWOphmgnVVMynO0", audioId: "1eKzzRfaw2jChm4_j8Serk_3Lv-JNaO9h" },
      { id: "4",  img: "https://lh3.googleusercontent.com/d/1rXWE3it2GvMA-wNXf01RtnZ_HiQoPT-t", audioId: "1I8m4pT90RaghUUII0lBOe7KiRzz72W0Q" },
      { id: "5",  img: "https://lh3.googleusercontent.com/d/1fA6cACO67jckdJThTFr5iN2v1Say-v2B", audioId: "1cban5yv7JtJi6eqLU-xTYiOxEcBoXQvi" },
      { id: "6",  img: "https://lh3.googleusercontent.com/d/10x9800p3xqJhnWGko1jWECNGENta9Dl3", audioId: "1dxOkATa2mkHslloILR38SDXLQU8Oizz4" },
      { id: "7",  img: "https://lh3.googleusercontent.com/d/1OpSO3vzWEpbn9_ELO-EM7A-qNc04_9Hu", audioId: "1r6HIPqCa1hC41ueO-C8KurpyCLcsb4dA" },
      { id: "8",  img: "https://lh3.googleusercontent.com/d/1npIhqbO6f-HosjsZtS5mpqmUmXrll0RD", audioId: "1yJSNPN54mBWOeuVMw0_eevXe02-wVoGi" },
      { id: "9",  img: "https://lh3.googleusercontent.com/d/1APexhFztWEnN38XETU_5ngsFZicv00lB", audioId: "11QAc8qXZ9nZ0syR1pYWHwWsKQ5W5er16" },
      { id: "10", img: "https://lh3.googleusercontent.com/d/1gNzsZ5T6ZsKJCN54Z8JvwYpsSD9Ay6LH", audioId: "1NuziSHKggcy-__L2PYYhlCMgjtiawVYC" },
      { id: "11", img: "https://lh3.googleusercontent.com/d/1osi0wzXTYU1oKF8_5gexr0dzi-vm6zOF", audioId: "1PEx8-XnrU0z8NHAWmsy2pssl8t2YkFhU" },
      { id: "12", img: "https://lh3.googleusercontent.com/d/1qVMPm3V91cC0l5GG7yG0KmTSk-tG3Yom", audioId: "1QbNUVYY_k4IWFMo1s5LFH-FBBmi98YJZ" },
      { id: "13", img: "https://lh3.googleusercontent.com/d/1f8jYRYyyvitbQCyri5EZAK1AfgkK85jt", audioId: "1np9pxT7C3MYZteDghX0R-ZVHxtYC_W3O" }
    ];

    let timerInterval = null;
    let secondsElapsed = 0;
    let isGameActive = false;
    let currentOrientation = 'portrait';
    let shuffledSoundsList = [...dataset];

    // Native Web Audio Context for Smartboards
    let audioCtx = null;

    function initAudioContext() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      updateStatus('🎵 Audio Unlocked!');
    }

    function getAudioUrl(fileId) {
      return `https://docs.google.com/uc?export=download&id=${fileId}`;
    }

    async function fetchAndPlayWebAudio(url, statusMsg) {
      initAudioContext();
      updateStatus(statusMsg || '⏳ Loading Sound...');

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error('Fetch failed');
        const arrayBuffer = await response.arrayBuffer();
        const decodedData = await audioCtx.decodeAudioData(arrayBuffer);
        
        const source = audioCtx.createBufferSource();
        source.buffer = decodedData;
        source.connect(audioCtx.destination);
        source.start(0);
        
        updateStatus('▶ Playing...');
        source.onended = () => updateStatus('🎵 Ready');
      } catch (e) {
        console.warn('WebAudio failed, trying fallback HTML5 player', e);
        fallbackHtml5Play(url, statusMsg);
      }
    }

    function fallbackHtml5Play(url, statusMsg) {
      const a = new Audio();
      a.crossOrigin = 'anonymous';
      a.src = url;
      a.play().then(() => {
        updateStatus(statusMsg || '▶ Playing...');
        a.onended = () => updateStatus('🎵 Ready');
      }).catch(err => {
        console.error("Audio playback failure:", err);
        updateStatus('⚠️ Sound Blocked by Board');
      });
    }

    function speakText(lang) {
      initAudioContext();
      const textToSpeak = lang === 'ta' ? TAMIL_SENTENCE : ENGLISH_SENTENCE;
      
      // Fallback 1: Web Speech Synthesis API (Native Smartboard TTS)
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(textToSpeak);
        utterance.lang = lang === 'ta' ? 'ta-IN' : 'en-US';
        utterance.onstart = () => updateStatus(lang === 'ta' ? '🗣️ Tamil Speech...' : '🗣️ English Speech...');
        utterance.onend = () => updateStatus('🎵 Ready');
        utterance.onerror = () => tryExternalTts(textToSpeak, lang);
        window.speechSynthesis.speak(utterance);
      } else {
        tryExternalTts(textToSpeak, lang);
      }
    }

    function tryExternalTts(text, lang) {
      const ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=${lang}&client=tw-ob`;
      fetchAndPlayWebAudio(ttsUrl, lang === 'ta' ? '🗣️ Tamil Speech...' : '🗣️ English Speech...');
    }

    function playSound(item) {
      const soundUrl = getAudioUrl(item.audioId);
      fetchAndPlayWebAudio(soundUrl, `🔊 Sound ${item.id}`);
    }

    function startSpeechToText(lang) {
      initAudioContext();
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert('Speech Recognition is not supported on this browser.');
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = lang === 'ta' ? 'ta-IN' : 'en-US';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      const targetBox = lang === 'ta' ? document.getElementById('sttResultTa') : document.getElementById('sttResultEn');
      targetBox.textContent = "Listening...";
      updateStatus(lang === 'ta' ? '🎙️ Listening Tamil...' : '🎙️ Listening English...');

      recognition.start();

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        targetBox.textContent = transcript;
        updateStatus('✅ Speech Captured!');
      };

      recognition.onerror = (event) => {
        targetBox.textContent = "Error!";
        updateStatus(`⚠️ STT Error: ${event.error}`);
      };

      recognition.onend = () => {
        setTimeout(() => updateStatus('🎵 Ready'), 2000);
      };
    }

    function updateStatus(msg) {
      document.getElementById('audioStatus').textContent = msg;
    }

    function selectOrientation(mode) {
      initAudioContext();
      currentOrientation = mode;
      document.getElementById('orientationModal').style.display = 'none';
      renderLayout(dataset, shuffledSoundsList);
    }

    function renderLayout(images, sounds) {
      const container = document.getElementById('gameContainer');
      container.innerHTML = '';

      if (currentOrientation === 'portrait') {
        container.className = 'game-container mode-portrait';

        const leftCol = document.createElement('div');
        leftCol.className = 'portrait-col';
        leftCol.innerHTML = '<div class="portrait-col-title">🖼️ Target Images</div>';

        images.forEach(item => {
          const card = document.createElement('div');
          card.className = 'portrait-img-card';
          card.innerHTML = `
            <img src="${item.img}" alt="${item.id}">
            <div class="sound-drop-box portrait-drop-box" data-target-id="${item.id}"></div>
          `;
          leftCol.appendChild(card);
        });

        const rightCol = document.createElement('div');
        rightCol.className = 'portrait-col';
        rightCol.innerHTML = '<div class="portrait-col-title">🔊 Available Sounds</div>';

        sounds.forEach(item => {
          const slot = document.createElement('div');
          slot.className = 'portrait-sound-slot';
          const dragItem = createSoundBlock(item);
          slot.appendChild(dragItem);
          rightCol.appendChild(slot);
        });

        container.appendChild(leftCol);
        container.appendChild(rightCol);

      } else {
        container.className = 'game-container mode-landscape';

        const imgRowHeader = document.createElement('div');
        imgRowHeader.className = 'landscape-grid-header';
        imgRowHeader.textContent = 'Target Images & Drop Area (1-13)';
        container.appendChild(imgRowHeader);

        images.forEach(item => {
          const card = document.createElement('div');
          card.className = 'landscape-img-card';
          card.innerHTML = `
            <img src="${item.img}" alt="${item.id}">
            <div class="sound-drop-box landscape-drop-box" data-target-id="${item.id}"></div>
          `;
          container.appendChild(card);
        });

        const soundRowHeader = document.createElement('div');
        soundRowHeader.className = 'landscape-grid-header';
        soundRowHeader.textContent = 'Available Sounds';
        container.appendChild(soundRowHeader);

        sounds.forEach(item => {
          const slot = document.createElement('div');
          slot.className = 'landscape-sound-slot';
          const dragItem = createSoundBlock(item);
          slot.appendChild(dragItem);
          container.appendChild(slot);
        });
      }
    }

    function createSoundBlock(item) {
      const dragItem = document.createElement('div');
      dragItem.className = 'draggable-sound';
      dragItem.dataset.id = item.id;

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'audio-symbol-btn';
      btn.textContent = '🔊';

      const triggerAudio = (e) => {
        e.preventDefault();
        e.stopPropagation();
        playSound(item);
      };

      btn.addEventListener('pointerdown', triggerAudio);

      dragItem.appendChild(btn);
      enableDrag(dragItem);
      return dragItem;
    }

    function startGame() {
      initAudioContext();
      resetTimer();
      startTimer();
      isGameActive = true;

      document.getElementById('btnStart').disabled = true;
      document.getElementById('btnCheck').disabled = false;
      document.getElementById('btnReset').disabled = true;
      document.getElementById('audioStatus').textContent = '🎮 Match sounds to images!';

      shuffledSoundsList = [...dataset].sort(() => Math.random() - 0.5);
      renderLayout(dataset, shuffledSoundsList);
    }

    function checkAnswers() {
      stopTimer();
      isGameActive = false;

      document.getElementById('btnStart').disabled = true;
      document.getElementById('btnCheck').disabled = true;
      document.getElementById('btnReset').disabled = false;

      let correctCount = 0;

      document.querySelectorAll('.sound-drop-box').forEach(box => {
        const targetId = box.dataset.targetId;
        const child = box.querySelector('.draggable-sound');

        box.classList.remove('correct', 'wrong', 'missed');

        if (!child) {
          box.classList.add('missed');
        } else if (child.dataset.id === targetId) {
          box.classList.add('correct');
          correctCount++;
        } else {
          box.classList.add('wrong');
        }
      });

      document.getElementById('score').textContent = `${correctCount}/13`;
      document.getElementById('audioStatus').textContent = `🏆 Score: ${correctCount}/13`;
    }

    function resetGame() {
      stopTimer();
      isGameActive = false;
      document.getElementById('btnStart').disabled = false;
      document.getElementById('btnCheck').disabled = true;
      document.getElementById('btnReset').disabled = true;
      document.getElementById('score').textContent = '0/13';
      document.getElementById('timer').textContent = '00:00';
      document.getElementById('audioStatus').textContent = '🎵 Ready';
      document.getElementById('sttResultTa').textContent = 'Waiting...';
      document.getElementById('sttResultEn').textContent = 'Waiting...';
      shuffledSoundsList = [...dataset];
      renderLayout(dataset, dataset);
    }

    function enableDrag(elem) {
      elem.addEventListener('pointerdown', e => {
        if (!isGameActive || e.target.tagName === 'BUTTON') return;
        elem.classList.add('dragging');
        elem.setPointerCapture(e.pointerId);
      });

      elem.addEventListener('pointermove', e => {
        if (!isGameActive || !elem.classList.contains('dragging')) return;
        const rect = elem.getBoundingClientRect();
        elem.style.transform = `translate(${e.clientX - (rect.width / 2)}px, ${e.clientY - (rect.height / 2)}px)`;
        elem.style.position = 'fixed';
        elem.style.zIndex = '1000';
        elem.style.width = '60px';
        elem.style.height = '30px';
      });

      elem.addEventListener('pointerup', e => {
        if (!elem.classList.contains('dragging')) return;
        elem.classList.remove('dragging');
        elem.releasePointerCapture(e.pointerId);
        elem.style.transform = 'none';
        elem.style.position = 'static';
        elem.style.width = '100%';
        elem.style.height = '100%';

        if (!isGameActive) return;

        const targetArea = document.elementFromPoint(e.clientX, e.clientY)?.closest('.sound-drop-box, .portrait-sound-slot, .landscape-sound-slot, .portrait-img-card, .landscape-img-card');
        if (targetArea) {
          if (targetArea.classList.contains('portrait-img-card') || targetArea.classList.contains('landscape-img-card')) {
            const dropZone = targetArea.querySelector('.sound-drop-box');
            if (dropZone) dropZone.appendChild(elem);
          } else {
            targetArea.appendChild(elem);
          }
        }
      });
    }

    function startTimer() {
      stopTimer();
      secondsElapsed = 0;
      timerInterval = setInterval(() => {
        secondsElapsed++;
        const m = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const s = String(secondsElapsed % 60).padStart(2, '0');
        document.getElementById('timer').textContent = `${m}:${s}`;
      }, 1000);
    }
    function stopTimer() { if (timerInterval) clearInterval(timerInterval); }
    function resetTimer() { stopTimer(); secondsElapsed = 0; document.getElementById('timer').textContent = '00:00'; }

    window.onload = () => {
      document.getElementById('btnPortrait').addEventListener('click', () => selectOrientation('portrait'));
      document.getElementById('btnLandscape').addEventListener('click', () => selectOrientation('landscape'));
      document.getElementById('btnStart').addEventListener('click', startGame);
      document.getElementById('btnCheck').addEventListener('click', checkAnswers);
      document.getElementById('btnReset').addEventListener('click', resetGame);
      document.getElementById('btnTtsTa').addEventListener('click', () => speakText('ta'));
      document.getElementById('btnTtsEn').addEventListener('click', () => speakText('en'));
      document.getElementById('btnSttTa').addEventListener('click', () => startSpeechToText('ta'));
      document.getElementById('btnSttEn').addEventListener('click', () => startSpeechToText('en'));

      ['touchstart', 'pointerdown', 'click'].forEach(evt => {
        document.body.addEventListener(evt, initAudioContext, { once: false });
      });

      renderLayout(dataset, dataset);
    };
  </script>

</body>
</html>
